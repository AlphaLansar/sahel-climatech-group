name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compute site URL
        id: site
        run: |
          if [ -f public/CNAME ]; then
            DOMAIN=$(cat public/CNAME | tr -d '[:space:]')
            echo "url=https://${DOMAIN}" >> "$GITHUB_OUTPUT"
          else
            REPO_NAME="${GITHUB_REPOSITORY#*/}"
            OWNER_LOWER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
            if [ "$REPO_NAME" = "${OWNER_LOWER}.github.io" ]; then
              echo "url=https://${OWNER_LOWER}.github.io" >> "$GITHUB_OUTPUT"
            else
              echo "url=https://${OWNER_LOWER}.github.io/${REPO_NAME}" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.site.outputs.url }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
