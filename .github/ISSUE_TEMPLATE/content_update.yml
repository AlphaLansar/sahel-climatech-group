name: "✍️ Content update"
description: Request a text, translation or data correction (FR/EN)
labels: ["content"]
body:
  - type: input
    id: page
    attributes:
      label: Page(s) affected
      placeholder: "/projets/forosun-tech/, /en/projects/forosun-tech/"
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current text
  - type: textarea
    id: proposed
    attributes:
      label: Proposed text
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source / justification
      description: Link or reference confirming the update (contract, official document, etc.)
